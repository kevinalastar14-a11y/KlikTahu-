name: Render Shorts (paralel)

# Sistem render cepat: frame dibagi ke banyak runner sekaligus.
# 1) prep   : siapkan audio + timeline + hitung jumlah frame (juga audit tata letak)
# 2) render : N job paralel, masing-masing render potongan frame lalu encode sendiri (pengaturan sama; QC tahan latensi master)
# 3) merge  : gabungkan potongan (tanpa re-encode), mux audio, QC, unggah hasil + Release
# Selain manual (workflow_dispatch), workflow ini ikut terpicu otomatis oleh PUSH
# pada branch kerja agen: begitu episode/engine berubah, render langsung jalan
# (fallback episode di bawah; naikkan bersamaan saat pindah episode).
on:
  push:
    branches: [arena/01a0cc99-kliktahu-shorts]
    paths:
      - 'episodes/ep49_bintang/**'
      - '!episodes/ep49_bintang/METADATA.md'
      - '!pustaka/**'
      - 'render.py'
      - 'diagrams.py'
      - 'process_audio.py'
      - 'build_audio.py'
      - 'build_timeline.py'
      - 'master_audio.py'
      - '.github/workflows/render.yml'
  workflow_dispatch:
    inputs:
      episode:
        description: "Slug episode (folder di episodes/)"
        default: "ep49_bintang"
        required: true
      chunks:
        description: "Jumlah potongan paralel (mis. 12)"
        default: "12"
      jobs:
        description: "Proses paralel per runner (mis. 4)"
        default: "4"
      make_release:
        description: "Unggah hasil ke GitHub Release?"
        type: boolean
        default: true

# keamanan: izin default hanya BACA; hanya job merge (buat Release) yang boleh menulis
permissions:
  contents: read

concurrency:
  group: render-${{ github.ref }}-${{ inputs.episode || 'auto' }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- prep
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      total: ${{ steps.calc.outputs.total }}
      chunks: ${{ steps.calc.outputs.chunks }}
      matrix: ${{ steps.calc.outputs.matrix }}
      out_name: ${{ steps.calc.outputs.out_name }}
      durasi: ${{ steps.calc.outputs.durasi }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Pasang dependensi
        run: pip install -q -r requirements.txt
      - name: Siapkan episode (audio -> timeline -> audio master)
        env:
          EP: ${{ inputs.episode || 'ep49_bintang' }}
        run: |
          set -euo pipefail
          source "episodes/$EP/config.env"
          cp "episodes/$EP/content.json" .
          mkdir -p audio audio_proc build
          cp "episodes/$EP/audio_raw/"*.wav audio/
          export KT_BUILD=build
          SPEED=$SPEED TARGET_WPS=${TARGET_WPS:-1.95} python3 process_audio.py | tail -12
          MAXDUR=$MAXDUR python3 build_timeline.py | tail -8
          SPEED=$SPEED python3 build_audio.py | tail -4
          python3 master_audio.py | tail -3
      - name: Audit tata letak (gagal cepat kalau ada masalah)
        env:
          EP: ${{ inputs.episode || 'ep49_bintang' }}
        run: |
          set -euo pipefail
          source "episodes/$EP/config.env"
          python3 check_layout.py | tail -12
      - name: Hitung jumlah frame + matriks
        id: calc
        env:
          EP: ${{ inputs.episode || 'ep49_bintang' }}
          CHUNKS_IN: ${{ inputs.chunks || '6' }}
        run: |
          set -euo pipefail
          source "episodes/$EP/config.env"
          python3 - "$FPS" "$CHUNKS_IN" "$OUT_NAME" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          fps, chunks, out = float(sys.argv[1]), int(sys.argv[2]), sys.argv[3]
          tl = json.load(open("timeline.json"))
          total = int(round(tl["total"] * fps))
          print(f"total={total}")
          print(f"chunks={chunks}")
          print(f"out_name={out}")
          print(f"durasi={tl['total']:.2f}")
          print("matrix=" + json.dumps({"chunk": list(range(chunks))}))
          PY
      - name: Simpan timeline (dipakai semua job render)
        uses: actions/upload-artifact@v4
        with:
          name: prep-timeline
          path: timeline.json
          retention-days: 3
      - name: Simpan audio master + naskah (dipakai job merge)
        uses: actions/upload-artifact@v4
        with:
          name: prep-audio
          path: |
            build/audio_master.wav
            build/audio_master_vo.wav
            build/audio.wav
            content.json
          retention-days: 3

  # -------------------------------------------------------------- render
  render:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 6          # hemat: maksimal 6 runner bersamaan
      matrix: ${{ fromJson(needs.prep.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Pasang dependensi
        run: pip install -q -r requirements.txt
      - name: Ambil timeline
        uses: actions/download-artifact@v4
        with:
          name: prep-timeline
          path: .
      - name: Render + encode potongan ${{ matrix.chunk }}
        env:
          EP: ${{ inputs.episode || 'ep49_bintang' }}
          CHUNK: ${{ matrix.chunk }}
          TOTAL: ${{ needs.prep.outputs.total }}
          CHUNKS: ${{ needs.prep.outputs.chunks }}
        run: |
          set -euo pipefail
          source "episodes/$EP/config.env"
          PER=$(( (TOTAL + CHUNKS - 1) / CHUNKS ))
          LO=$(( CHUNK * PER ))
          HI=$(( LO + PER ))
          if [ "$HI" -gt "$TOTAL" ]; then HI=$TOTAL; fi
          if [ "$LO" -ge "$TOTAL" ]; then echo "potongan $CHUNK kosong — dilewati"; exit 0; fi
          echo "potongan $CHUNK: frame $LO..$((HI-1)) ($((HI-LO)) frame)"
          FF=$(python3 -c "import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())")
          python3 render.py --fps "$FPS" --ss "$SS" --sharpen "$SHARPEN" --jobs "$JOBS" \
                            --range "$LO:$HI" --outdir frames
          "$FF" -y -loglevel error -framerate "$FPS" -start_number "$LO" -i frames/f_%05d.png \
                -frames:v "$((HI-LO))" -an -c:v libx264 -preset "$PRESET" -tune "$TUNE" \
                -b:v "$VBITRATE" -maxrate "$MAXRATE" -bufsize "$BUFSIZE" -pix_fmt yuv420p \
                -profile:v high -level 4.2 -threads 2 "part_${CHUNK}.mp4"
          ls -la "part_${CHUNK}.mp4"
      - name: Unggah potongan
        uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.chunk }}
          path: part_${{ matrix.chunk }}.mp4
          retention-days: 3

  # --------------------------------------------------------------- merge
  merge:
    needs: [prep, render]
    runs-on: ubuntu-latest
    permissions:
      contents: write          # hanya job ini yang membuat Release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Pasang dependensi
        run: pip install -q -r requirements.txt
      - name: Ambil timeline
        uses: actions/download-artifact@v4
        with:
          name: prep-timeline
          path: .
      - name: Ambil audio master
        uses: actions/download-artifact@v4
        with:
          name: prep-audio
          path: .
      - name: Ambil semua potongan
        uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: parts
      - name: Gabung potongan + mux audio
        env:
          EP: ${{ inputs.episode || 'ep49_bintang' }}
        run: |
          set -euo pipefail
          source "episodes/$EP/config.env"
          export KT_BUILD=build KT_AUDIO_SRC=build/audio_master.wav
          FF=$(python3 -c "import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())")
          : > list.txt
          for i in $(seq 0 $((CHUNKS-1))); do
            f="parts/part-$i/part_$i.mp4"
            if [ -f "$f" ]; then echo "file $f" >> list.txt; fi
          done
          cat list.txt
          "$FF" -y -loglevel error -f concat -safe 0 -i list.txt -c copy video_master.mp4
          "$FF" -y -loglevel error -i video_master.mp4 -i build/audio_master.wav \
                -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a "$ABITRATE" -ar 48000 \
                -movflags +faststart -shortest "${OUT_NAME}.mp4"
          ls -la "${OUT_NAME}.mp4"
      - name: QC akhir
        env:
          EP: ${{ inputs.episode || 'ep49_bintang' }}
        run: |
          set -euo pipefail
          source "episodes/$EP/config.env"
          export KT_BUILD=build KT_AUDIO_SRC=build/audio_master.wav
          python3 qc_mp4.py "${OUT_NAME}.mp4" | tail -25
      - name: Siapkan berkas rilis
        run: |
          set -euo pipefail
          source "episodes/${{ inputs.episode || 'ep49_bintang' }}/config.env"
          mkdir -p dist
          cp "${OUT_NAME}.mp4" dist/
          cp "episodes/${{ inputs.episode || 'ep49_bintang' }}/METADATA.md" dist/ 2>/dev/null || true
          cp "episodes/${{ inputs.episode || 'ep49_bintang' }}/content.json" "dist/${OUT_NAME}_content.json"
          du -h dist/*
      - name: Unggah hasil akhir (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: final-${{ needs.prep.outputs.out_name }}
          path: dist/*
          retention-days: 30
      - name: Terbitkan ke GitHub Release
        if: ${{ github.event_name == 'push' || inputs.make_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prep.outputs.out_name }}-${{ github.run_number }}
          name: "${{ inputs.episode || 'ep49_bintang' }} — ${{ needs.prep.outputs.durasi }}s — run ${{ github.run_number }}"
          body: |
            Render otomatis dari GitHub Actions (paralel ${{ inputs.chunks || '12' }} potongan × ${{ inputs.jobs || '4' }} proses).

            - Episode: `${{ inputs.episode || 'ep49_bintang' }}`
            - Durasi: ${{ needs.prep.outputs.durasi }} detik · ${{ needs.prep.outputs.total }} frame
            - Video: ${{ needs.prep.outputs.out_name }}.mp4 (1080×1920, 60 fps)
            - Dependensi: Pillow + imageio-ffmpeg (Xvid-free, tanpa GPU)
          files: dist/*
          make_latest: true
      - name: Ringkasan
        run: |
          set -euo pipefail
          source "episodes/${{ inputs.episode || 'ep49_bintang' }}/config.env"
          echo "### Hasil render" >> "$GITHUB_STEP_SUMMARY"
          echo "- Episode: \`${{ inputs.episode || 'ep49_bintang' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Durasi: ${{ needs.prep.outputs.durasi }} s (${{ needs.prep.outputs.total }} frame @ $FPS fps)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Potongan: ${{ inputs.chunks || '12' }} × ${{ inputs.jobs || '4' }} proses" >> "$GITHUB_STEP_SUMMARY"
          du -h "${OUT_NAME}.mp4" >> "$GITHUB_STEP_SUMMARY" || true
