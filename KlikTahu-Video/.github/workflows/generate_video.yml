name: KlikTahu Short — Build & (opsional) Upload

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Unggah ke YouTube setelah render selesai"
        type: boolean
        default: false
      privacy:
        description: "Status privasi video"
        type: choice
        options: [private, unlisted, public]
        default: private
  schedule:
    # Senin & Kamis, 09:17 WIB (02:17 UTC). Slot upload mingguan yang wajar.
    - cron: '17 2 * * 1,4'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        # Catatan: ffmpeg tidak perlu diinstal — imageio-ffmpeg membundel binernya.

      - name: Render voice-over (edge-tts)
        run: |
          if [ -f narration/01_hook.mp3 ]; then
            echo "narration/ sudah ada di repo — melewati sintesis."
          else
            python voice_over.py
          fi

      - name: Build video (1080x1920 @ 60 fps)
        run: python cinematic_engine.py --render --target-mb 235

      - name: Verifikasi hasil
        run: python tools/verify_video.py KlikTahu_Shorts_1080x1920.mp4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kliktahu-short
          path: KlikTahu_Shorts_1080x1920.mp4
          retention-days: 14
          compression-level: 0

      - name: Upload ke YouTube (opsional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python tools/youtube_upload.py --privacy "${{ inputs.privacy }}"
