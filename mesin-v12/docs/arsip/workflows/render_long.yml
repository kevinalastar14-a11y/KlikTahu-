name: Render Video Panjang 16:9 (paralel)

# Video panjang (long/<slug>/): 1920x1080, 30 fps, durasi bebas.
# 1) prep   : audio VO (pipeline yang sama dengan Shorts) -> timeline -> penyelarasan kata
#             -> master VO -> campuran SFX (audio_long.py) -> thumbnail
# 2) render : N potongan paralel (render_long.py --range) langsung ke mp4
# 3) merge  : gabung tanpa re-encode + mux audio + QC + GitHub Release (mp4 + thumbnail + metadata)
# Terpicu oleh push yang mengubah long/** (kecuali METADATA.md) atau file ini.
on:
  push:
    branches: [arena/01a0cc99-kliktahu-shorts]
    paths:
      - 'long/**'
      - '!long/**/METADATA.md'
      - '.github/workflows/render_long.yml'
  workflow_dispatch:
    inputs:
      slug:
        description: "Folder video panjang di long/"
        default: "v02_laut_dalam"
        required: true

# keamanan: izin default hanya BACA; hanya job merge (buat Release) yang boleh menulis
permissions:
  contents: read

concurrency:
  group: render-long-${{ github.ref }}
  cancel-in-progress: false

env:
  SLUG: ${{ inputs.slug || 'v02_laut_dalam' }}

jobs:
  # ---------------------------------------------------------------- prep
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      total: ${{ steps.calc.outputs.total }}
      chunks: ${{ steps.calc.outputs.chunks }}
      matrix: ${{ steps.calc.outputs.matrix }}
      out_name: ${{ steps.calc.outputs.out_name }}
      durasi: ${{ steps.calc.outputs.durasi }}
      menit: ${{ steps.calc.outputs.menit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Pasang dependensi
        run: pip install -q -r requirements.txt
      - name: Audio VO -> timeline -> penyelarasan kata -> master -> campuran SFX
        run: |
          set -euo pipefail
          source "long/$SLUG/config.env"
          cp "long/$SLUG/content.json" .
          mkdir -p audio audio_proc build
          cp "long/$SLUG/audio_raw/"*.wav audio/
          export KT_BUILD=build
          SPEED=$SPEED TARGET_WPS=${TARGET_WPS:-1.90} python3 process_audio.py | tail -14
          MAXDUR=$MAXDUR python3 build_timeline.py | tail -12
          SPEED=$SPEED python3 build_audio.py | tail -4
          python3 master_audio.py | tail -4
          python3 long/render_long.py --slug "$SLUG" --align | tail -12
          mkdir -p build/mix
          python3 long/audio_long.py --slug "$SLUG" --out build/mix/audio_master.wav
          python3 "long/$SLUG/thumbnail.py" --out build/thumbnail.jpg
      - name: Bab (timestamp YouTube)
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          tl = json.load(open("timeline.json"))
          print("### Bab (untuk deskripsi YouTube)")
          for s in tl["scenes"]:
              t = s["start"] if s["start"] < 1 else s["start"] + 0.25
              print(f"- {int(t // 60)}:{int(t % 60):02d} {s.get('bab', s['id'])}  (mulai {s['start']:.2f} s)")
          PY
      - name: Hitung jumlah frame + matriks
        id: calc
        run: |
          set -euo pipefail
          source "long/$SLUG/config.env"
          python3 - "$FPS" "$CHUNKS" "$OUT_NAME" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          fps, chunks, out = float(sys.argv[1]), int(sys.argv[2]), sys.argv[3]
          tl = json.load(open("timeline.json"))
          total = int(round(tl["total"] * fps))
          print(f"total={total}")
          print(f"chunks={chunks}")
          print(f"out_name={out}")
          print(f"durasi={tl['total']:.2f}")
          print(f"menit={int(tl['total'] // 60)}:{int(tl['total'] % 60):02d}")
          print("matrix=" + json.dumps({"chunk": list(range(chunks))}))
          PY
      - name: Simpan timeline
        uses: actions/upload-artifact@v4
        with:
          name: long-timeline
          path: timeline.json
          retention-days: 3
      - name: Simpan audio + thumbnail
        uses: actions/upload-artifact@v4
        with:
          name: long-audio
          path: |
            build/mix/audio_master.wav
            build/audio_master_vo.wav
            build/audio.wav
            build/thumbnail.jpg
            content.json
          retention-days: 3

  # -------------------------------------------------------------- render
  render:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8          # hemat: maksimal 8 runner bersamaan
      matrix: ${{ fromJson(needs.prep.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Pasang dependensi
        run: pip install -q -r requirements.txt
      - name: Ambil timeline
        uses: actions/download-artifact@v4
        with:
          name: long-timeline
          path: .
      - name: Render + encode potongan ${{ matrix.chunk }}
        env:
          CHUNK: ${{ matrix.chunk }}
          TOTAL: ${{ needs.prep.outputs.total }}
          CHUNKS: ${{ needs.prep.outputs.chunks }}
        run: |
          set -euo pipefail
          source "long/$SLUG/config.env"
          PER=$(( (TOTAL + CHUNKS - 1) / CHUNKS ))
          LO=$(( CHUNK * PER ))
          HI=$(( LO + PER ))
          if [ "$HI" -gt "$TOTAL" ]; then HI=$TOTAL; fi
          if [ "$LO" -ge "$TOTAL" ]; then echo "potongan $CHUNK kosong - dilewati"; exit 0; fi
          echo "potongan $CHUNK: frame $LO..$((HI-1)) ($((HI-LO)) frame)"
          python3 long/render_long.py --slug "$SLUG" --timeline timeline.json --fps "$FPS" --ss "$SS" \
                  --jobs "$JOBS" --range "$LO:$HI" --vb "$VBITRATE" --maxrate "$MAXRATE" --bufsize "$BUFSIZE" \
                  --preset "$PRESET" --tune "$TUNE" --out "part_${CHUNK}.mp4"
          ls -la "part_${CHUNK}.mp4"
      - name: Unggah potongan
        uses: actions/upload-artifact@v4
        with:
          name: lpart-${{ matrix.chunk }}
          path: part_${{ matrix.chunk }}.mp4
          retention-days: 3

  # --------------------------------------------------------------- merge
  merge:
    needs: [prep, render]
    runs-on: ubuntu-latest
    permissions:
      contents: write          # hanya job ini yang membuat Release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Pasang dependensi
        run: pip install -q -r requirements.txt
      - name: Ambil timeline
        uses: actions/download-artifact@v4
        with:
          name: long-timeline
          path: .
      - name: Ambil audio + thumbnail
        uses: actions/download-artifact@v4
        with:
          name: long-audio
          path: .
      - name: Ambil semua potongan
        uses: actions/download-artifact@v4
        with:
          pattern: lpart-*
          path: parts
      - name: Gabung potongan + mux audio
        env:
          CHUNKS: ${{ needs.prep.outputs.chunks }}
        run: |
          set -euo pipefail
          source "long/$SLUG/config.env"
          FF=$(python3 -c "import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())")
          : > list.txt
          for i in $(seq 0 $((CHUNKS-1))); do
            f="parts/lpart-$i/part_$i.mp4"
            if [ -f "$f" ]; then echo "file $f" >> list.txt; else echo "POTONGAN $i HILANG"; exit 1; fi
          done
          "$FF" -y -loglevel error -f concat -safe 0 -i list.txt -c copy video_master.mp4
          "$FF" -y -loglevel error -i video_master.mp4 -i build/mix/audio_master.wav \
                -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a "$ABITRATE" -ar 48000 \
                -movflags +faststart -shortest "${OUT_NAME}.mp4"
          ls -la "${OUT_NAME}.mp4"
      - name: QC wajib (durasi, ukuran, audio utuh)
        run: |
          set -euo pipefail
          source "long/$SLUG/config.env"
          python3 - "${OUT_NAME}.mp4" <<'PY'
          import json, re, subprocess, sys, wave
          import numpy as np, imageio_ffmpeg
          ff = imageio_ffmpeg.get_ffmpeg_exe(); mp4 = sys.argv[1]
          info = subprocess.run([ff, "-hide_banner", "-i", mp4], capture_output=True, text=True).stderr
          h, m, s = re.search(r"Duration: (\d+):(\d+):([\d.]+)", info).groups()
          dur = int(h) * 3600 + int(m) * 60 + float(s)
          total = json.load(open("timeline.json"))["total"]
          ok_size = "1920x1080" in info
          print(f"durasi {dur:.2f}s vs timeline {total:.2f}s | 1920x1080: {ok_size}")
          raw = subprocess.run([ff, "-v", "error", "-i", mp4, "-vn", "-ac", "1", "-ar", "8000", "-f", "s16le", "-"],
                               capture_output=True).stdout
          a = np.frombuffer(raw, "<i2").astype(float)
          vo = np.frombuffer(subprocess.run([ff, "-v", "error", "-i", "build/audio_master_vo.wav", "-ac", "1", "-ar", "8000",
                                             "-f", "s16le", "-"], capture_output=True).stdout, "<i2").astype(float)
          n = min(len(a), len(vo)); blk = 4000; k = n // blk
          ea = np.sqrt((a[:k*blk].reshape(k, blk)**2).mean(1)); ev = np.sqrt((vo[:k*blk].reshape(k, blk)**2).mean(1))
          bicara = ev > ev.max() * 0.03
          ratio = np.median(ea[bicara] / ev[bicara])
          hilang = int((ea[bicara] < ev[bicara] * ratio * 0.5).sum())
          print(f"blok VO 0,5 s: {int(bicara.sum())} | yang hilang/teredam >6 dB: {hilang} | rasio median {ratio:.3f}")
          for j in np.where(bicara & (ea < ev * ratio * 0.5))[0][:10]:
              print(f"  blok {j*0.5:.1f}s: mp4 {ea[j]:.0f} vs VO {ev[j]:.0f}")
          if abs(dur - total) > 0.5 or not ok_size or hilang > 0:
              print("QC GAGAL"); sys.exit(1)
          print("QC OK")
          PY
      - name: QC tambahan (informasi)
        continue-on-error: true
        run: |
          source "long/$SLUG/config.env"
          export KT_BUILD=build KT_AUDIO_SRC=build/mix/audio_master.wav
          python3 qc_mp4.py "${OUT_NAME}.mp4" | tail -30
      - name: Siapkan berkas rilis
        run: |
          set -euo pipefail
          source "long/$SLUG/config.env"
          mkdir -p dist
          cp "${OUT_NAME}.mp4" dist/
          cp build/thumbnail.jpg dist/thumbnail.jpg
          cp "long/$SLUG/METADATA.md" dist/ 2>/dev/null || true
          P="pustaka/${OUT_NAME#KlikTahu_}"; [ -f "$P/SIAP_TEMPEL.md" ] && cp "$P/SIAP_TEMPEL.md" dist/ || true
          cp "long/$SLUG/content.json" "dist/${OUT_NAME}_content.json"
          du -h dist/*
      - name: Unggah hasil akhir (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: final-${{ needs.prep.outputs.out_name }}
          path: dist/*
          retention-days: 30
      - name: Terbitkan ke GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prep.outputs.out_name }}-${{ github.run_number }}
          name: "${{ needs.prep.outputs.out_name }} 16:9 - ${{ needs.prep.outputs.menit }} - run ${{ github.run_number }}"
          body: |
            Video panjang 16:9 (render paralel ${{ needs.prep.outputs.chunks }} potongan).

            - Folder: `long/${{ env.SLUG }}`
            - Durasi: ${{ needs.prep.outputs.menit }} (${{ needs.prep.outputs.durasi }} s) - ${{ needs.prep.outputs.total }} frame
            - Video: ${{ needs.prep.outputs.out_name }}.mp4 (1920x1080, 30 fps) + thumbnail.jpg (1280x720)
            - Teks unggah: SIAP_TEMPEL.md (judul, deskripsi + bab, hashtag, tag) / METADATA.md (analisis + sumber)
            - Audio: VO utuh (tanpa potongan) + SFX, tanpa musik, tanpa subtitle
          files: dist/*
          make_latest: true
