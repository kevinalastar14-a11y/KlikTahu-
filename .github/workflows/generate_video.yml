name: Render KlikTahu cinematic video

on:
  workflow_dispatch:
    inputs:
      use_ai:
        description: Generate a fresh script and Indonesian voice-over using the configured OpenAI API secret
        type: boolean
        required: false
        default: false
      topic:
        description: Optional topic for AI generation (used only when use_ai is enabled)
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: kliktahu-render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: KlikTahu-Video/requirements.txt

      - name: Install pinned project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r KlikTahu-Video/requirements.txt

      - name: Generate script and voice-over (opt-in)
        if: ${{ inputs.use_ai }}
        working-directory: KlikTahu-Video
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VIDEO_TOPIC: ${{ inputs.topic }}
        run: |
          if [ -n "$VIDEO_TOPIC" ]; then
            python ai_generator.py --ai --voiceover --topic "$VIDEO_TOPIC"
          else
            python ai_generator.py --ai --voiceover
          fi

      - name: Render the video
        working-directory: KlikTahu-Video
        run: python cinematic_engine.py --output KlikTahu_Cinematic.mp4

      - name: Upload the finished video
        uses: actions/upload-artifact@v7
        with:
          name: kliktahu-cinematic-video
          path: KlikTahu-Video/KlikTahu_Cinematic.mp4
          if-no-files-found: error
          retention-days: 5
